    <path d="M-42 0 L42 -52"/>
    <path d="M-42 0 L42 52"/>

</g>

<!-- Share Icon White Lines -->
<g transform="translate(356 485)"
    fill="none"
    stroke="#ffffff"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round">

    <path d="M-42 0 L42 -52"/>
    <path d="M-42 0 L42 52"/>

</g>

<!-- Bigger Share Dots with Border -->
<g transform="translate(356 485)">

    <circle cx="-48" cy="0" r="28"
        fill="#ffffff"
        stroke="#850c25"
        stroke-width="8"/>

    <circle cx="48" cy="-60" r="28"
        fill="#ffffff"
        stroke="#850c25"
        stroke-width="8"/>

    <circle cx="48" cy="60" r="28"
        fill="#ffffff"
        stroke="#850c25"
        stroke-width="8"/>

</g>

<!-- Top gold fitting -->
<rect x="280" y="288"
