    <path d="M356 325 C356 420 356 550 356 648"/>
    <path d="M286 327 C245 393 243 568 309 649"/>
    <path d="M426 327 C467 393 469 568 403 649"/>
    <path d="M281 337 C203 379 166 477 192 559"/>
    <path d="M431 337 C509 379 546 477 520 559"/>

</g>

<!-- Share Icon Border -->
<g transform="translate(356 485)"
