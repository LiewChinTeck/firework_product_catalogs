    <path d="M310 691 V744 Q310 755 318 755 Q326 755 326 744 V691"/>
    <path d="M328 691 V744 Q328 755 336 755 Q344 755 344 744 V691"/>
    <path d="M346 691 V744 Q346 755 354 755 Q362 755 362 744 V691"/>
    <path d="M364 691 V744 Q364 755 372 755 Q380 755 380 744 V691"/>
    <path d="M382 691 V744 Q382 755 390 755 Q398 755 398 744 V691"/>
    <path d="M400 691 V744 Q400 755 408 755 Q416 755 416 744 V691"/>
    <path d="M418 691 V744 Q418 755 426 755 Q434 755 434 744 V691"/>

</g>

<!-- Independent animated tassel -->
<g id="tassel">

