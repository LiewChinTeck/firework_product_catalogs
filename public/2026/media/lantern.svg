
<svg xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 713 1024">

<defs>
    <radialGradient id="bodyRed"
    cx="51%" cy="48%" r="65%">
        <stop offset="0%" stop-color="#ff777b"/>
        <stop offset="65%" stop-color="#f22e50"/>
        <stop offset="100%" stop-color="#c9002c"/>
    </radialGradient>

    <linearGradient id="gold"
    x1="0" y1="0" x2="1" y2="0">
        <stop stop-color="#9b641c"/>
        <stop offset=".16" stop-color="#f7d77b"/>
        <stop offset=".35" stop-color="#fff4c4"/>
        <stop offset=".55" stop-color="#e5b64e"/>
        <stop offset=".78" stop-color="#fff1b1"/>
        <stop offset="1" stop-color="#98601b"/>
    </linearGradient>

    <radialGradient id="bead"
    cx="35%" cy="28%" r="70%">
        <stop stop-color="#fffde0"/>
        <stop offset=".7" stop-color="#ffe9a0"/>
        <stop offset="1" stop-color="#e5b64e"/>
    </radialGradient>
</defs>

<!-- Hanging cord -->
<path d="M356 80 V220"
    stroke="#850b22"
    stroke-width="8"
    stroke-linecap="round"/>

<!-- Top beads -->
<circle cx="356" cy="231" r="15"
    fill="url(#bead)"
    stroke="#93601c"
    stroke-width="6"/>

<circle cx="356" cy="265" r="21"
    fill="url(#bead)"
    stroke="#93601c"
    stroke-width="7"/>

<!-- Main lantern body -->
<path d="
    M356 320
