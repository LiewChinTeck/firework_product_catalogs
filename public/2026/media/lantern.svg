    C128 498 158 568 211 610
    C249 640 299 651 356 651
    C413 651 463 640 501 610
    C554 568 584 498 551 424
    C522 359 444 320 356 320Z"
    fill="url(#bodyRed)"
    stroke="#850c25"
    stroke-width="7"/>

<!-- Side and lower shading -->
<path d="M158 481 C153 548 204 611 279 643"
    fill="none"
    stroke="#a90c2d"
    stroke-width="8"/>

<path d="M554 481 C559 548 508 611 433 643"
    fill="none"
