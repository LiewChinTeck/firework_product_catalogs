
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <meta name="theme-color" content="#160d25">
    <title>Firework Catalogue 2027</title>
    <meta name="description" content="Explore our 2027 Chinese New Year fireworks catalogue.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Firework Catalogue 2027">
    <meta property="og:description" content="Explore our 2027 Chinese New Year fireworks catalogue.">
    <meta property="og:url" content="https://fireworkproductcatalogs.vercel.app/">
    <meta property="og:image" content="https://fireworkproductcatalogs.vercel.app/banner/2027.png">
    <meta property="og:image:alt" content="2027 Chinese New Year Fireworks Celebration">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Firework Catalogue 2027">
    <meta name="twitter:description" content="Explore our 2027 Chinese New Year fireworks catalogue.">
    <meta name="twitter:image" content="https://fireworkproductcatalogs.vercel.app/banner/2027.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Video -->
    <div class="background-video">
        <video autoplay muted loop playsinline>
            <source src="2026/media/background.mp4" type="video/mp4">
        </video>
    </div>
    <!-- Main content -->
    <main class="main-container">

<!-- HERO BANNER -->
<section class="hero-banner">
    <img
        src="2026/banner/2027.png"
        alt="2027 Chinese New Year Fireworks Celebration"
    >
</section>

        <!-- Search -->
        <section class="search-section">
            <div class="search-box">
                <span class="search-icon">⌕</span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search product name or code..."
                    autocomplete="off"
                >
		<button
		    type="button"
		    id="clearSearch"
		    class="clear-search"
		    aria-label="Clear search"
		    hidden
		>×</button>
            </div>
        </section>


        <!-- Category filters -->
        <section class="category-section">
            <div id="categoryFilters" class="category-filters">
                <!-- Generated by JavaScript -->
            </div>
        </section>


        <!-- Product heading -->
        <section class="product-heading">
            <h2>Our Products</h2>
            <span id="productCount">Loading...</span>
        </section>


        <!-- Product list -->
        <section id="productGrid" class="product-grid">

            <!-- Product cards generated by JavaScript -->

        </section>


        <!-- Empty state -->
        <div id="emptyState" class="empty-state" hidden>
            <div>✧</div>
            <p>No products found.</p>
        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>LIGHT UP YOUR CELEBRATION ✦</p>
    </footer>


    <!-- Fullscreen video viewer -->
    <div
        id="videoViewer"
        class="video-viewer"
        aria-hidden="true"
    >

        <button
            id="closeVideo"
            class="close-video"
            type="button"
            aria-label="Close video"
        >
            ×
        </button>

        <video
            id="productVideo"
            playsinline
            controls
            autoplay
            preload="none"
        ></video>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
